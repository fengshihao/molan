name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Studio browser e2e
        run: pnpm e2e
      - name: Portal smoke
        run: |
          node scripts/sync-studio-to-site.mjs
          pnpm check
      - name: Extension check
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a pnpm --filter molan-markdown check
